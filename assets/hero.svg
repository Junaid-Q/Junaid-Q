<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
<title id="t">Dr. Junaid Qadir — Research Profile</title><desc id="d">Animated colorful research network for AI, cybersecurity, robotics, biomedical intelligence and 6G.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".42" stop-color="#0b0b24"/><stop offset=".72" stop-color="#12102d"/><stop offset="1" stop-color="#071b1d"/></linearGradient>
