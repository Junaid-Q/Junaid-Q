<style>.name{font:800 52px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.role{font:500 19px Inter,Segoe UI,Arial,sans-serif;fill:#d8e7ef}.mono{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2.2px;fill:#99efff}.micro{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.4px;fill:#aeb9d9}.edge{fill:none;stroke:url(#rainbow);stroke-width:1.4;stroke-dasharray:8 10;opacity:.68;animation:dash 9s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}.float{animation:float 7s ease-in-out infinite}.float2{animation:float2 9s ease-in-out infinite}.blink{animation:blink 3.6s ease-in-out infinite}.orb{animation:orb 8s ease-in-out infinite}.scan{animation:scan 6s linear infinite}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{transform:scale(.78);opacity:.45}50%{transform:scale(1.38);opacity:1}}@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(9px,-11px)}}@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-11px,8px)}}@keyframes blink{0%,100%{opacity:.15}50%{opacity:1}}@keyframes orb{0%,100%{opacity:.35}50%{opacity:.72}}@keyframes scan{0%{transform:translateX(-250px)}100%{transform:translateX(1450px)}}</style>
</defs>
